<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Rock Paper Scissors Game</h1>
    </header>

    <div class="choices">

        <img src="/rock.jpeg" class="choice rock">
       
        <img src="/paper.jpeg" class="choice paper">
        
        <img src="/scissor.jpeg" class="choice scissors">

    </div>

    <div class="score-board">

        <div class="score">
            <h1 id="user-score">0</h1>
            <p>You</p>
        </div>

        <div class="score">
            <h1 id="computer-score">0</h1>
            <p>Computer</p>
        </div>

    </div>

    <div class="result-box">
        <h2 id="result">Choose your move</h2>
        <p id="computer-choice"></p>
    </div>

<script src="Javasc.js"></script>

</body>
</html>
